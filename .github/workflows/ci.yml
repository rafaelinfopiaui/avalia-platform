# ==============================================================================
# CI Mínima — AvalIA (BL-AV-1-06 / DEBT-AV-005 / Sprint AV-S02)
# ==============================================================================
# Este workflow estabelece o pipeline mínimo e hermético de integração contínua
# do monorepo AvalIA, cobrindo:
#   - core: backend FastAPI + SQLAlchemy + PostgreSQL 16
#   - ai-engine: microsserviço FastAPI de inferência/avaliação assistida
#   - frontend: aplicação web Vite + React + TypeScript
#
# Contexto e Decisões de Engenharia:
# 1. Triggers: Disparado em 'push' e 'pull_request' para a branch 'main'.
# 2. Job 'core': Sobe um serviço postgres:16 com healthcheck e exporta DATABASE_URL
#    para validação da paridade de infraestrutura. A suíte de testes de unidade e
#    integração do core é desenhada com SQLite em arquivo temporário (tmp_path,
#    core/app/tests/conftest.py), portanto a limpeza explícita de variáveis ('env -u AI_ENGINE_URL -u DATABASE_URL
#    -u JWT_SECRET') é proposital e recomendada (vide core/README.md), garantindo
#    isolamento e determinismo na execução. O serviço postgres:16 é mantido como
#    infraestrutura de paridade/futura extensão, mas os testes atuais NÃO o exercitam.
# 3. Job 'ai-engine': Executa a suíte de testes em dois steps separados:
#    (a) modo padrão (sem AI_ENGINE_MODE setado, padrão 'real');
#    (b) modo simulado global ('AI_ENGINE_MODE=simulated').
#    Essa execução dupla é necessária para resguardar o isolamento corrigido em
#    BL-AV-1-09 (resolução de DEBT-AV-009 na sprint AV-S02), assegurando que o
#    comportamento dos testes com mock de reparo JSON/LLM e os cenários simulados
#    permaneçam íntegros e independentes do ambiente de execução.
# 4. Job 'frontend': Executa 'npm ci', 'npm run lint' (ESLint mínimo, ver
#    frontend/eslint.config.js) e 'npm run build' com cache de dependências
#    npm gerenciado via actions/setup-node.
# 5. Lint Python mínimo (BL-AV-1-06, item 3 desta sprint): Ruff (E, F, I;
#    ver ruff.toml na raiz) roda como step adicional nos jobs 'core' e
#    'ai-engine', sem autofix/reformatação em CI — apenas checagem. A
#    correção de achados reais já foi aplicada ao código nesta sprint;
#    a CI apenas confirma que o estado permanece limpo.
# 6. Segurança e Escopo: Workflow estritamente de validação contínua (CI). Não
#    contém jobs de deploy, release, publicação de pacotes externos ou dependência
#    de segredos de produção (secrets).
# ==============================================================================

name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  core:
    name: Core API (FastAPI + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: avalia_dev
          POSTGRES_USER: avalia_user
          POSTGRES_PASSWORD: avalia_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: core/requirements.txt

      - name: Install dependencies in virtualenv
        run: |
          python3.11 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: |
          source .venv/bin/activate
          ruff check --config ../ruff.toml app

      - name: Run core tests
        env:
          DATABASE_URL: postgresql+psycopg2://avalia_user:avalia_password@localhost:5432/avalia_dev
        run: |
          source .venv/bin/activate
          env -u AI_ENGINE_URL -u DATABASE_URL -u JWT_SECRET pytest app/tests -q

      # ------------------------------------------------------------------------
      # Testes de CONCORRÊNCIA em PostgreSQL REAL (distintos da suíte SQLite acima).
      #
      # A suíte "Run core tests" roda em SQLite (por desenho — ver conftest.py).
      # Os testes `test_pg_*` (@requires_postgres) exigem PostgreSQL real via
      # AVALIA_TEST_POSTGRES_URL e, sem ela, ficam SKIPPED. Este step os executa
      # explicitamente contra bancos descartáveis EXCLUSIVOS no serviço postgres
      # da CI (nunca `avalia_dev`), com guard anti-skip-silencioso: a presença do
      # serviço ou o nome do job NÃO são prova; a prova é 10 casos PG executados.
      #
      # Dois bancos descartáveis (um por arquivo), porque a fixture pg_engine de
      # test_manual_transcription faz drop_all no teardown (destruiria o schema
      # do outro arquivo) e a de test_answer_image_deletion exige o schema vindo
      # de `alembic upgrade head` (assert alembic_version). Ambos os nomes contêm
      # "test" (guard interno dos próprios testes contra bancos protegidos).
      # Credenciais: as do serviço postgres da CI já declaradas acima; não são
      # segredo de produção e nenhum segredo novo é adicionado.
      # ------------------------------------------------------------------------
      - name: Run PostgreSQL concurrency tests (real Postgres, not SQLite)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: avalia_user
          PGPASSWORD: avalia_password
        run: |
          source .venv/bin/activate
          set -euo pipefail

          BASE="postgresql+psycopg2://avalia_user:avalia_password@localhost:5432"
          DB_IMG="avalia_test_ci_img_${GITHUB_RUN_ID}"
          DB_TXN="avalia_test_ci_txn_${GITHUB_RUN_ID}"

          # Cria os bancos descartáveis exclusivos (idempotente). Usa o próprio
          # psycopg2 (já instalado) conectando ao banco administrativo "postgres",
          # para não depender do cliente psql no runner.
          python - "$DB_IMG" "$DB_TXN" <<'PY'
          import sys, psycopg2
          from psycopg2 import sql
          admin = "postgresql://avalia_user:avalia_password@localhost:5432/postgres"
          conn = psycopg2.connect(admin); conn.autocommit = True
          cur = conn.cursor()
          for name in sys.argv[1:]:
              assert "test" in name and name not in {"avalia_dev", "postgres"}, name
              cur.execute(sql.SQL("DROP DATABASE IF EXISTS {}").format(sql.Identifier(name)))
              cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(name)))
          cur.close(); conn.close()
          print("bancos descartáveis criados:", *sys.argv[1:])
          PY

          # DB_IMG exige o schema de `alembic upgrade head` (assert de alembic_version).
          DATABASE_URL="${BASE}/${DB_IMG}" alembic upgrade head

          # Executa só os test_pg_* de cada arquivo, cada um no seu banco, emitindo
          # JUnit XML para verificação objetiva de coletados/executados/skipped.
          rm -f pg_img.xml pg_txn.xml  # evita XML legado em runner persistente/local (ACH-02)
          set +e
          AVALIA_TEST_POSTGRES_URL="${BASE}/${DB_IMG}" \
            pytest app/tests/test_answer_image_deletion.py -k "test_pg_" \
            -v -rsa -p no:cacheprovider --tb=short --junitxml=pg_img.xml
          RC_IMG=$?
          AVALIA_TEST_POSTGRES_URL="${BASE}/${DB_TXN}" \
            pytest app/tests/test_manual_transcription.py -k "test_pg_" \
            -v -rsa -p no:cacheprovider --tb=short --junitxml=pg_txn.xml
          RC_TXN=$?
          set -e

          # Guard anti-skip-silencioso: exige exatamente 10 casos PG executados
          # (5 + 5), 0 skipped, 0 falhas/erros. Qualquer desvio => exit 1.
          python - pg_img.xml pg_txn.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          EXPECTED = {"pg_img.xml": 5, "pg_txn.xml": 5}
          tot = dict(tests=0, failures=0, errors=0, skipped=0)
          for f in sys.argv[1:]:
              root = ET.parse(f).getroot()
              s = root if root.tag == "testsuite" else root.find("testsuite")
              vals = {k: int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
              for k in tot: tot[k] += vals[k]
              print(f"{f}: {vals}")
              if vals["tests"] != EXPECTED[f]:
                  print(f"GUARD FALHOU: {f} coletou {vals['tests']} casos PG, esperado {EXPECTED[f]}.")
                  sys.exit(1)
          print("TOTAL PostgreSQL:", tot)
          if tot["skipped"] != 0:
              print("GUARD FALHOU: há testes PostgreSQL SKIPPED — a cobertura real não executou "
                    "(AVALIA_TEST_POSTGRES_URL ausente ou seleção vazia?).")
              sys.exit(1)
          if tot["tests"] != 10:
              print(f"GUARD FALHOU: esperados 10 casos PostgreSQL, executados {tot['tests']}.")
              sys.exit(1)
          if tot["failures"] or tot["errors"]:
              print("GUARD FALHOU: há falhas/erros nos testes PostgreSQL.")
              sys.exit(1)
          print("OK: 10 casos de concorrência PostgreSQL executados e aprovados (0 skipped).")
          PY

          # Falha o step se o pytest em si retornou erro (redundante com o guard,
          # mas explícito).
          if [ "$RC_IMG" -ne 0 ] || [ "$RC_TXN" -ne 0 ]; then
            echo "pytest retornou erro (RC_IMG=$RC_IMG RC_TXN=$RC_TXN)."
            exit 1
          fi

          # Limpeza (o runner é efêmero, mas dropamos por higiene).
          python - "$DB_IMG" "$DB_TXN" <<'PY'
          import sys, psycopg2
          from psycopg2 import sql
          conn = psycopg2.connect("postgresql://avalia_user:avalia_password@localhost:5432/postgres")
          conn.autocommit = True
          cur = conn.cursor()
          for name in sys.argv[1:]:
              # Defesa em profundidade (ACH-01): mesma asserção de segurança do bloco de criação.
              assert "test" in name and name not in {"avalia_dev", "postgres"}, name
              cur.execute(sql.SQL("DROP DATABASE IF EXISTS {}").format(sql.Identifier(name)))
          cur.close(); conn.close()
          PY

  ai-engine:
    name: AI Engine (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies in virtualenv
        run: |
          python3.11 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: |
          source .venv/bin/activate
          ruff check --config ../ruff.toml app

      - name: Test ai-engine (default mode)
        run: |
          source .venv/bin/activate
          pytest -q

      - name: Test ai-engine (simulated mode)
        run: |
          source .venv/bin/activate
          AI_ENGINE_MODE=simulated pytest -q

  frontend:
    name: Frontend (Vite + React + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build frontend bundle
        run: npm run build
